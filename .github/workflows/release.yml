name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-bin libayatana-appindicator3-dev patchelf rpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux packages and companion CLI
        run: |
          pnpm exec tauri build --bundles deb,rpm
          test -x src-tauri/target/release/ryuk
      - name: Check packaged runtime dependency metadata
        shell: python
        run: |
          import pathlib, shutil, subprocess
          root = pathlib.Path('src-tauri/target/release/bundle')
          # Stage packages under apostrophe-free names: package names carrying
          # an apostrophe break rpm's CLI quoting on some distros and make
          # poor download filenames.
          staged = pathlib.Path('staged-packages'); staged.mkdir(exist_ok=True)
          for package in root.glob('*/*.*'):
              if package.suffix in ('.deb', '.rpm'):
                  safe = package.name.replace("'", '').replace(' ', '-')
                  shutil.copy2(package, staged / safe)
          for kind, command, required in [
              ('deb', ['dpkg-deb', '--field'], ['libwebkit2gtk-4.1-0', 'libgtk-3-0', 'libayatana-appindicator3-1', 'librsvg2-2', 'xdg-utils']),
              ('rpm', ['rpm', '-qp', '--requires'], ['libwebkit2gtk-4.1.so.0', 'libgtk-3.so.0', 'libayatana-appindicator3.so.1', 'librsvg-2.so.2', 'xdg-utils']),
          ]:
              packages = list(staged.glob('*.' + kind))
              assert packages, f'No {kind} packages produced'
              for package in packages:
                  args = command + [str(package)] + (['Depends'] if kind == 'deb' else [])
                  metadata = subprocess.check_output(args, text=True)
                  print(metadata)
                  assert all(dep in metadata for dep in required), f'Missing runtime dependency in {package}'
      - name: Prepare checked standalone download
        id: standalone
        shell: python
        run: |
          import json, os, pathlib, shutil, tarfile
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          archive = f'ryuknotes_{version}_linux_x86_64.tar.gz'
          destination = pathlib.Path('linux-download')
          destination.mkdir()
          for binary in ['ryuknotes', 'ryuk']:
              shutil.copy2(pathlib.Path('src-tauri/target/release') / binary, destination / binary)
          shutil.copy2('scripts/install-linux.sh', destination / 'install.sh')
          shutil.copy2('docs/linux-install.md', destination / 'README.md')
          with tarfile.open(archive, 'w:gz') as output:
              output.add(destination, arcname='ryuknotes-linux')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'archive={archive}\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ryuknotes-linux-x86_64
          path: |
            staged-packages/*.deb
            staged-packages/*.rpm
            ${{ steps.standalone.outputs.archive }}
      - name: Attach Linux downloads to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staged-packages/*.deb
            staged-packages/*.rpm
            ${{ steps.standalone.outputs.archive }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: pnpm install --prod=false

      - name: Build Tauri app
        run: pnpm exec tauri build
        env:
          NO_STRIP: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ryuknotes-macos
          path: |
            src-tauri/target/release/bundle/macos
            src-tauri/target/release/bundle/dmg

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
