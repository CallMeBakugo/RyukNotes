name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build deps (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-bin libayatana-appindicator3-dev

      - name: Install frontend deps
        run: pnpm install --prod=false

      - name: Verify (check + JS tests + Rust tests + clippy + fmt + build)
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" pnpm run check
          PATH="$PWD/node_modules/.bin:$PATH" node --test tests/*.test.mjs src/lib/utils/*.test.mjs
          PATH="$PWD/node_modules/.bin:$PATH" pnpm run test:rust
          PATH="$PWD/node_modules/.bin:$PATH" pnpm run lint:rust
          PATH="$PWD/node_modules/.bin:$PATH" pnpm build